name: My Mastodon Digest
on:
  push:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  update:
    name: digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install curl and unzip
        run: sudo apt-get install -y curl unzip
      - name: checkout
        uses: actions/checkout@master
        with:
          ref: main
      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: python things
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download previous digest
        run: |
          curl -o ./render/previous.html https://abhin4v.github.io/mastodon_digest/
          curl -o ./render/previous2.html https://abhin4v.github.io/mastodon_digest/previous.html
      - name: Download digested_posts.json
        run: |
          if curl -fsSL -o digested_posts.json.gz https://abhin4v.github.io/mastodon_digest/digested_posts.json.gz; then
            gunzip digested_posts.json.gz
          elif curl -fsSL -o digested_posts.json https://abhin4v.github.io/mastodon_digest/digested_posts.json; then
            echo "Downloaded uncompressed digested_posts.json"
          else
            echo '[]' > digested_posts.json
          fi
      - name: run digest
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
        run: python run.py ./render/
      - name: Gzip digested_posts.json
        run: gzip -k digested_posts.json && mv digested_posts.json.gz render/
      - name: publish
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: gh-pages
          build_dir: render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
